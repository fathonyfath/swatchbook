name: Release

# Run by hand on main: builds and signs the release APK with the toolchain from flake.nix and
# publishes it as a GitHub release. A commit that already has a release is not built again.
#
# Repository secrets:
#   RELEASE_KEYSTORE_BASE64    the keystore file, from: base64 -w0 <keystore>
#   RELEASE_KEYSTORE_PASSWORD  the keystore's password
#   RELEASE_KEY_ALIAS          optional, when the keystore holds more than one key
#   RELEASE_KEY_PASS           optional, when the key has a password of its own

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.build.outputs.build }}
      released: ${{ steps.build.outputs.released }}
    steps:
      - uses: actions/checkout@v7

      - name: Look for a release of this commit
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build="$(./release.sh --build)"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if gh release view "build-$build" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Build $build is already released: nothing to do."
          fi

  release:
    needs: check
    if: needs.check.outputs.released != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # To create the GitHub release.
      contents: write
    env:
      BUILD: ${{ needs.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The version code counts every commit.
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31

      - name: Restore the keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          # Checked here because without a password apksigner would ask for one.
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KS_PASS" ]; then
            echo "::error::The RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD secrets must be set."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build and sign
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          RELEASE_KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}
        # flake.nix pins its input itself, so there is no lock file to write or commit.
        run: nix develop --no-write-lock-file --command ./release.sh

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v7
        with:
          name: swatchbook-${{ env.BUILD }}
          path: release/
          if-no-files-found: error

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
          {
            echo "Built from commit [\`$BUILD\`]($commit_url)."
            previous="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
            if [ -n "$previous" ]; then
              echo
              echo "## Changes since $previous"
              echo
              git log --format='- %s (%h)' "$previous..HEAD"
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release create "build-$BUILD" release/* \
            --target "$GITHUB_SHA" \
            --title "Build $BUILD" \
            --notes-file "$RUNNER_TEMP/notes.md"
